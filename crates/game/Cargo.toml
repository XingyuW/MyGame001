[package]
name = "game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sim = { path = "../sim" }
# "2d", "ui", and "audio" are Bevy 0.19 feature collections; the default set would also
# build the 3D renderer, which this game does not use.
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui", "audio"] }
bevy_ecs_tiled = "=0.13.4"
bevy_ecs_tilemap = "=0.19.0"
