[package]
name = "sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Invariant I1: no rendering, windowing, audio, or input dependency.
# The umbrella `bevy` crate is deliberately not used here: even with
# `default-features = false` it pulls in `bevy_input` (see docs/DECISIONS.md, A3).
[dependencies]
bevy_app = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.10.0", default-features = false }
# Map loading (docs/DECISIONS.md, M1). Both are pure parsers; `tiled` is used without its default
# `zstd` feature, exactly as `bevy_ecs_tiled` uses it, so no crate is added to Cargo.lock.
# `quick-xml` must stay at the version `tiled` uses: the layer data pre-check relies on parsing
# exactly as `tiled` does.
quick-xml = "=0.31.0"
tiled = { version = "=0.16.0", default-features = false }
# Data files (PLAN.md section 5; docs/DECISIONS.md A5 and D18). Both are pure parsers and already
# in Cargo.lock through Bevy, so no package is added. A data file reaches `ron` only after it has
# passed the subset check of `data.rs` (invariant I11).
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
